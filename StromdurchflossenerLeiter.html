<script>
        let sliderR, sliderJ0, sliderJR;
        
        function setup() {
            let canvas = createCanvas(600, 300);
            let container = document.getElementById('canvas-container');
            resizeCanvas(container.offsetWidth - 20, 300);
            canvas.parent('canvas-container');

            sliderR = document.getElementById('sliderR');
            sliderJ0 = document.getElementById('sliderJ0');
            sliderJR = document.getElementById('sliderJR');

            sliderR.oninput = function() { document.getElementById('r-val').innerText = this.value; }
            sliderJ0.oninput = function() { document.getElementById('j0-val').innerText = this.value; }
            sliderJR.oninput = function() { document.getElementById('jr-val').innerText = this.value; }
        }

        function draw() {
            background(250);
            
            let R = parseFloat(sliderR.value);
            let j0 = parseFloat(sliderJ0.value);
            let jR = parseFloat(sliderJR.value);
            
            let rMax = 15; // Max X-Achse
            
            // NEU: Dynamische Skalierung der Y-Achse
            // Berechnet das absolute Maximum, das bei r = R auftritt
            let H_max = (j0/2)*R + ((jR-j0)/(3*R))*R*R;
            let hMax = H_max * 1.2; // 20% Platz nach oben lassen für eine schöne Optik
            if (hMax < 1) hMax = 1; // Verhindert Fehler, wenn alle Regler auf 0 stehen
            
            // Achsen zeichnen
            stroke(150); strokeWeight(1);
            line(40, 260, width-20, 260); // X-Achse
            line(40, 260, 40, 20); // Y-Achse
            fill(100); noStroke(); textAlign(CENTER, CENTER);
            text("r", width-10, 260);
            text("H(r)", 40, 10);
            
            // Zeichne R-Markierung
            let pixR = map(R, 0, rMax, 40, width-20);
            stroke(200, 100, 100); drawingContext.setLineDash([5, 5]);
            line(pixR, 260, pixR, 20);
            drawingContext.setLineDash([]);
            fill(200, 50, 50); noStroke(); text("R", pixR, 275);
            
            // H(r) Funktion zeichnen
            noFill(); stroke(37, 99, 235); strokeWeight(3);
            beginShape();
            for (let r = 0; r <= rMax; r += 0.1) {
                let H = 0;
                if (r <= R) {
                    H = (j0/2)*r + ((jR-j0)/(3*R))*r*r; // Inneres Feld
                } else {
                    let constPart = (j0/6) + (jR/3);
                    H = (R*R / r) * constPart; // Äußeres Feld
                }
                
                let px = map(r, 0, rMax, 40, width-20);
                let py = map(H, 0, hMax, 260, 20);
                
                vertex(px, py); // Punkt zeichnen
            }
            endShape();
        }
    </script>
